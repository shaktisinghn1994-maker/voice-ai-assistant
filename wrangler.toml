# voice-ai-assistant — Cloudflare Worker (API) + static assets (Vite dist).
# Git-connected: dashboard runs `npm run build`, then deploys this Worker.
# Local Express server (server.ts) is dev-only; production API logic is shared
# with Pages Functions via functions/_lib/api.ts.

name = "voice-ai-assistant"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "parallel-eats-db"
database_id = "c11d0196-5a54-437a-9f17-f33a32c764f5"
